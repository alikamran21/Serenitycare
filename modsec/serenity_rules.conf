# =============================================================================
# modsec/serenity_rules.conf
# Custom WAF rules for Serenity Honeypot
#
# How the DB-logging works:
#   When ModSecurity detects SQLi it sets a variable and triggers a redirect
#   to /api/waf-alert — a lightweight Flask endpoint that writes the attacker
#   IP directly into monitor.threat_actors. This way the WAF auto-populates
#   the SIEM table without the Flask business logic having to do the work.
# =============================================================================

# ── Rule 1001: SQL Injection — classic UNION SELECT ───────────────────────────
SecRule ARGS|ARGS_NAMES|REQUEST_URI|REQUEST_BODY \
    "@rx (?i)(union[\s\+]+select|union\/\*.*\*\/select)" \
    "id:1001,\
     phase:2,\
     block,\
     log,\
     msg:'SQL Injection: UNION SELECT detected',\
     logdata:'Matched: %{MATCHED_VAR}',\
     severity:'CRITICAL',\
     tag:'SQLi',\
     setvar:'tx.sqli_score=+10',\
     chain"
    SecRule TX:SQLI_SCORE "@ge 10" \
        "setenv:MODSEC_ALERT=SQLi_UNION|%{REMOTE_ADDR}"

# ── Rule 1002: SQL Injection — boolean-based (1=1, OR '1'='1') ────────────────
SecRule ARGS|ARGS_NAMES|REQUEST_URI|REQUEST_BODY \
    "@rx (?i)(\b(or|and)\b\s+[\'\"]?\d+[\'\"]?\s*=\s*[\'\"]?\d+[\'\"]?|'\s*or\s*'[^']*'\s*=\s*'[^']*')" \
    "id:1002,\
     phase:2,\
     block,\
     log,\
     msg:'SQL Injection: Boolean-based blind SQLi detected',\
     logdata:'Matched: %{MATCHED_VAR}',\
     severity:'CRITICAL',\
     tag:'SQLi',\
     setenv:MODSEC_ALERT=SQLi_BOOL|%{REMOTE_ADDR}"

# ── Rule 1003: SQL Injection — stacked queries / comment sequences ─────────────
SecRule ARGS|ARGS_NAMES|REQUEST_URI|REQUEST_BODY \
    "@rx (?i)(--|;[\s]*--|\/\*[\s\S]*?\*\/|'\s*;|xp_|sp_executesql)" \
    "id:1003,\
     phase:2,\
     block,\
     log,\
     msg:'SQL Injection: Comment/stacked query sequence detected',\
     logdata:'Matched: %{MATCHED_VAR}',\
     severity:'HIGH',\
     tag:'SQLi',\
     setenv:MODSEC_ALERT=SQLi_COMMENT|%{REMOTE_ADDR}"

# ── Rule 1004: SQL Injection — dangerous keywords ─────────────────────────────
SecRule ARGS|ARGS_NAMES|REQUEST_URI|REQUEST_BODY \
    "@rx (?i)\b(drop\s+table|alter\s+table|truncate\s+table|delete\s+from|insert\s+into|exec\s*\(|execute\s*\(|cast\s*\(|convert\s*\(|char\s*\(|benchmark\s*\(|sleep\s*\(|waitfor\s+delay)\b" \
    "id:1004,\
     phase:2,\
     block,\
     log,\
     msg:'SQL Injection: Dangerous SQL keyword detected',\
     logdata:'Matched: %{MATCHED_VAR}',\
     severity:'CRITICAL',\
     tag:'SQLi',\
     setenv:MODSEC_ALERT=SQLi_KEYWORD|%{REMOTE_ADDR}"

# ── Rule 1005: SQL Injection — time-based blind (SLEEP, WAITFOR) ──────────────
SecRule ARGS|REQUEST_BODY \
    "@rx (?i)(sleep\s*\(\s*\d+\s*\)|waitfor\s+delay\s+'[0-9:]+'\s*--|pg_sleep\s*\(\s*\d+\s*\)|benchmark\s*\(\s*\d+)" \
    "id:1005,\
     phase:2,\
     block,\
     log,\
     msg:'SQL Injection: Time-based blind SQLi detected',\
     logdata:'Matched: %{MATCHED_VAR}',\
     severity:'CRITICAL',\
     tag:'SQLi',\
     setenv:MODSEC_ALERT=SQLi_TIMEBASED|%{REMOTE_ADDR}"

# ── Rule 2001: XSS — script injection ─────────────────────────────────────────
SecRule ARGS|ARGS_NAMES|REQUEST_URI \
    "@rx (?i)(<\s*script[\s>]|javascript\s*:|on(load|error|click|mouse)\s*=)" \
    "id:2001,\
     phase:2,\
     block,\
     log,\
     msg:'XSS: Script injection attempt detected',\
     logdata:'Matched: %{MATCHED_VAR}',\
     severity:'HIGH',\
     tag:'XSS',\
     setenv:MODSEC_ALERT=XSS|%{REMOTE_ADDR}"

# ── Rule 3001: Path Traversal ─────────────────────────────────────────────────
SecRule REQUEST_URI|ARGS \
    "@rx (?i)(\.\.\/|\.\.\\\\|%2e%2e%2f|%252e%252e%252f)" \
    "id:3001,\
     phase:2,\
     block,\
     log,\
     msg:'Path Traversal attempt detected',\
     logdata:'Matched: %{MATCHED_VAR}',\
     severity:'HIGH',\
     tag:'PathTraversal',\
     setenv:MODSEC_ALERT=PATH_TRAVERSAL|%{REMOTE_ADDR}"

# ── Rule 4001: Scanner / tool detection ───────────────────────────────────────
SecRule REQUEST_HEADERS:User-Agent \
    "@rx (?i)(sqlmap|nikto|nmap|masscan|zgrab|nuclei|burpsuite|owasp|dirbuster|gobuster|hydra|metasploit|nessus|openvas|w3af|acunetix|qualys)" \
    "id:4001,\
     phase:1,\
     block,\
     log,\
     msg:'Automated scanner/attack tool detected via User-Agent',\
     logdata:'UA: %{MATCHED_VAR}',\
     severity:'HIGH',\
     tag:'Scanner',\
     setenv:MODSEC_ALERT=SCANNER|%{REMOTE_ADDR}"
