# =============================================================================
# modsec/modsecurity.conf
# ModSecurity v3 configuration for Serenity Honeypot WAF
# =============================================================================

# Enable ModSecurity (use DetectionOnly to log without blocking during testing)
# Switch to: On   — to actively block and auto-log to DB
# Switch to: DetectionOnly — to log only (safe for initial testing)
SecRuleEngine On

# Allow ModSecurity to access the request body (needed to scan POST data)
SecRequestBodyAccess On
SecRequestBodyLimit 13107200
SecRequestBodyNoFilesLimit 131072

# Allow ModSecurity to access the response body
SecResponseBodyAccess Off

# Audit log — full details of every blocked request
SecAuditEngine RelevantOnly
SecAuditLog /var/log/nginx/modsec_audit.log
SecAuditLogType Serial
SecAuditLogParts ABIJDEFHZ

# Debug log (set to 0 in production, 3-5 for debugging)
SecDebugLogLevel 0

# Temporary files and data
SecTmpDir /tmp/modsec
SecDataDir /tmp/modsec

# Default action: block + log when a rule matches
SecDefaultAction "phase:2,log,deny,status:403"
