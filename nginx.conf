worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # =========================================================================
    # NEW: ModSecurity Web Application Firewall Configuration
    # =========================================================================
    modsecurity on;

    modsecurity_rules '
        # Turn the rule engine on and inspect request bodies (POST data)
        SecRuleEngine On
        SecRequestBodyAccess On
        
        # Default action: block and log
        SecDefaultAction "phase:2,deny,log,status:403"
        
        # Rule 1001: Detect obvious SQL Injection patterns
        # Targets common strings like UNION SELECT, DROP TABLE, or standard auth bypasses
        SecRule ARGS|REQUEST_BODY "@rx (?i)(union\\s+select|select\\s+.*\\s+from|insert\\s+into|drop\\s+table|update\\s+.*\\s+set|delete\\s+from|\\\'\\s*or\\s*\\\'?1\\\'?\\=\\\'?1|--\\s*$)" \
            "id:1001,\
            phase:2,\
            t:none,t:lowercase,\
            msg:\'Critical SQL Injection Attempt Detected by WAF\',\
            log,\
            deny,\
            status:403,\
            exec:/etc/nginx/waf_action.sh"
    ';
    server {
        listen 8080;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ $uri.html =404;
        }

        location /Honeypot/ {
            try_files $uri $uri/ =404;
        }

        location /api/ {
            proxy_pass         http://backend:5000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
            proxy_pass_header  Access-Control-Allow-Origin;
            proxy_pass_header  Access-Control-Allow-Methods;
            proxy_pass_header  Access-Control-Allow-Headers;
        }

        error_page 404 /index.html;
        error_page 500 502 503 504 /index.html;
    }
}