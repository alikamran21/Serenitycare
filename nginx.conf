# =============================================================================
# nginx.conf — Serenity Honeypot with ModSecurity WAF
#
# TWO NEW FEATURES added:
#
# 1. ModSecurity WAF
#    - Scans every /api/ request for SQL injection, XSS, scanners, etc.
#    - On detection: blocks with 403 AND fires an internal subrequest to
#      /api/waf-alert which writes the attacker IP into monitor.threat_actors.
#    - The Flask backend never sees the malicious request at all.
#
# 2. Canary Token PDF endpoint
#    - /api/canary  is passed through to Flask like any other API route.
#    - /api/canary/ping receives the beacon when attacker opens the PDF.
#    - Both are proxy_passed to backend normally — no special nginx config needed.
# =============================================================================

# Custom log format that includes the ModSecurity alert tag for SIEM correlation
log_format waf_combined '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent" '
                        'modsec="$modsec_alert"';

server {
    listen 8080;
    server_name localhost;

    root  /usr/share/nginx/html;
    index index.html;

    # ── ModSecurity WAF ──────────────────────────────────────────────
    # Enable ModSecurity engine on this server block.
    # The rules file (modsec/serenity_rules.conf) defines what to block.
    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsec/modsecurity.conf;

    # ── Access log with WAF info ──────────────────────────────────────
    access_log /var/log/nginx/access.log waf_combined;
    error_log  /var/log/nginx/error.log  warn;

    # ── Static frontend files ─────────────────────────────────────────
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location /Honeypot/ {
        try_files $uri $uri/ =404;
    }

    # ── WAF internal alert receiver ───────────────────────────────────
    # ModSecurity sets $modsec_alert env var when it blocks a request.
    # nginx then fires an internal subrequest here to log to DB.
    # This location is NOT accessible from outside (internal only).
    location /api/waf-alert {
        internal;                    # blocks external access to this endpoint

        proxy_pass         http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Original-Uri   $request_uri;

        # Pass the WAF alert details to Flask
        proxy_set_header   X-Modsec-Alert   $modsec_alert;
        # Secret so Flask knows this is a legitimate internal nginx request
        proxy_set_header   X-Waf-Internal   "phantasm-waf-internal";
    }

    # ── API proxy (with WAF alert hook) ──────────────────────────────
    location /api/ {
        # If ModSecurity blocked this request, $modsec_alert will be set.
        # We fire an async subrequest to log it, then return 403 to attacker.
        # The 'if' here sends the subrequest; nginx still returns 403 normally.
        set $modsec_alert "";

        # After ModSecurity blocks, redirect internally to log to DB
        # (ModSecurity sets the 403 status; this just triggers the DB write)
        error_page 403 = @waf_blocked;

        proxy_pass         http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_pass_header  Access-Control-Allow-Origin;
        proxy_pass_header  Access-Control-Allow-Methods;
        proxy_pass_header  Access-Control-Allow-Headers;
    }

    # ── WAF block handler ─────────────────────────────────────────────
    # When ModSecurity returns 403, nginx routes here.
    # We fire a background subrequest to log the attacker IP to the DB,
    # then return a clean 403 JSON response to the attacker.
    location @waf_blocked {
        # Fire internal subrequest to log attacker IP to monitor.threat_actors
        # This happens in the background — attacker just sees the 403.
        post_action /api/waf-alert;

        # Return a believable JSON 403 (not a default nginx page)
        default_type application/json;
        return 403 '{"detail":"Request blocked by security policy.","code":403}';

        add_header Access-Control-Allow-Origin  * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Content-Type                 application/json always;
    }

    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;
}
