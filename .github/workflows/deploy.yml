name: Auto-Deploy to Ubuntu Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # Go to the exact folder on your Ubuntu server
            cd ~/Repo/Serenitycare
            
            # Discard any local changes and pull the latest code
            git reset --hard HEAD
            git pull origin main
            
            # Rebuild and restart the Docker containers (without the hyphen!)
            sudo docker compose down
            sudo docker compose up -d --build
            
            # Clean up old Docker images to save space
            sudo docker image prune -f