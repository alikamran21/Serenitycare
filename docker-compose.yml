services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: phantasm_backend
    restart: unless-stopped
    environment:
      - FLASK_DEBUG=false
      - PORT=5000
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=HS256
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=60
      - OTP_EXPIRE_MINUTES=5
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_FROM=onboarding@resend.dev
      - SMTP_FROM_NAME=Serenity Psychiatric Care
      - TEST_EMAIL_OVERRIDE=${TEST_EMAIL_OVERRIDE}
      - RATE_LIMIT_REQUESTS=30
      - RATE_LIMIT_WINDOW_SECONDS=60
      - MAX_FAILED_LOGINS=5
      - ALLOWED_ORIGINS=*
      - FIELD_ENCRYPTION_KEY=${FIELD_ENCRYPTION_KEY}
      # WAF internal secret — must match X-Waf-Internal header in nginx.conf
      - WAF_INTERNAL_SECRET=phantasm-waf-internal
      # Canary beacon base URL — set to your public IP/domain so the PDF
      # phones home to YOUR server when the attacker opens it.
      # For local testing use:  http://localhost:8080
      # For production use:     https://your-domain.com
      - CANARY_BASE_URL=${CANARY_BASE_URL:-http://localhost:8080}
    expose:
      - "5000"
    networks:
      - phantasm_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health', timeout=15)"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 60s

  webserver:
    # Use the nginx image that includes the ModSecurity v3 module (njs + modsecurity).
    # owasp/modsecurity-crs:nginx includes ModSecurity compiled into nginx.
    image: owasp/modsecurity-crs:nginx-alpine-202501060101
    container_name: phantasm_webserver
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./modsec/modsecurity.conf:/etc/nginx/modsec/modsecurity.conf:ro
      - ./modsec/serenity_rules.conf:/etc/nginx/modsec/serenity_rules.conf:ro
      - ./:/usr/share/nginx/html:ro
    networks:
      - phantasm_net
    depends_on:
      - backend

networks:
  phantasm_net:
    driver: bridge
